<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Rally · WFM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #E7F6FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1d4288;
      padding: 10px 20px;
      border-radius: 50px;
      margin-bottom: 16px;
    }

    .login-brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .login-brand-divider {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.3);
    }

    .login-brand-sub {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-tagline {
      font-size: 14px;
      color: #4B5563;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #D1DAE5;
      border-radius: 8px;
      font-size: 15px;
      color: #0F172A;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus {
      border-color: #0067FF;
      box-shadow: 0 0 0 3px rgba(0,103,255,0.08);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #0067FF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .btn-login:hover { background: #005EE9; }
    .btn-login:active { background: #0050CC; }

    .error-msg {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #DC2626;
      margin-bottom: 20px;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-brand-bar">
        <span class="login-brand-name">Rally</span>
        <span class="login-brand-divider"></span>
        <span class="login-brand-sub">World Food Movement</span>
      </div>
      <div class="login-tagline">Volunteer Management Platform</div>
    </div>

    <div class="login-card">
      <h1>Staff Sign In</h1>
      <p>Enter your email and password to access the dashboard.</p>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@wfm.org"
                 value="{{ request.form.get('email', '') }}" autocomplete="email" autofocus required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>

    <div class="login-footer">
      Volunteer login? Use the <a href="/v/" style="color:#0067FF;">Volunteer App</a> instead.
    </div>
  </div>
</body>
</html>
